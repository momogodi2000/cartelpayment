name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://pawelium.fyi
      NEXT_PUBLIC_SITE_NAME: pawelium
      NEXT_PUBLIC_WHATSAPP_NUMBER: "+33641325328"
      NEXT_PUBLIC_CONTACT_EMAIL: contact@pawelium.fyi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # After build so Next's generated route types in .next/types are present.
      - name: Type check
        run: npm run typecheck

      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=high || true
